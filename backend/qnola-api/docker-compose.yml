services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      QNOLA_DATABASE_URL: postgresql+psycopg://qnola:qnola@postgres:5432/qnola
      QNOLA_JWT_SECRET: change-me-in-production
      QNOLA_DEV_SMS_CODE: "111111"
      QNOLA_MEDIA_ROOT: /app/data/media
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - qnola-media:/app/data/media
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qnola
      POSTGRES_PASSWORD: qnola
      POSTGRES_DB: qnola
    ports:
      - "5432:5432"
    volumes:
      - qnola-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  qnola-postgres:
  qnola-media:

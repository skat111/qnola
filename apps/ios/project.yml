name: Qnola
options:
  bundleIdPrefix: com.skat111
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.skat111.qnola
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Qnola:
    type: application
    platform: iOS
    sources:
      - Qnola
    resources:
      - Qnola/Assets.xcassets
    info:
      path: Qnola/Info.plist
      properties:
        CFBundleDisplayName: qnola
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
